version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: si_smq
      POSTGRES_USER: smq_user
      POSTGRES_PASSWORD: smq_pass
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3 — utilisée par document_service.py (MINIO_ENDPOINT=localhost:9000)
      - "9001:9001"   # Console web d'administration
    volumes: ["minio_data:/data"]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    depends_on: [db, redis, minio]
    environment:
      DATABASE_URL: postgresql://smq_user:smq_pass@db/si_smq

  frontend:
    build: ./frontend
    ports: ["3000:3000"]

volumes:
  postgres_data:
  minio_data:
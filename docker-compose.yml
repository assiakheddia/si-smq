version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: si_smq
      POSTGRES_USER: smq_user
      POSTGRES_PASSWORD: smq_pass
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smq_user -d si_smq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3 — utilisée par document_service.py
      - "9001:9001"   # Console web d'administration
    volumes: ["minio_data:/data"]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: smq_user
      POSTGRES_PASSWORD: smq_pass
      POSTGRES_DB: si_smq
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SECRET_KEY: "demo_secret_key_pour_evaluation_ne_pas_utiliser_en_production_32"
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      ANTHROPIC_API_KEY: "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"
      ANTHROPIC_MODEL: claude-haiku-4-5
      # GOOGLE_CLIENT_ID/SECRET : optionnels. Sans eux, l'app fonctionne
      # normalement (login classique, sans connexion Google).

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
    environment:
      VITE_BACKEND_URL: http://backend:8000

volumes:
  postgres_data:
  minio_data:
version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: si_smq
      POSTGRES_USER: smq_user
      POSTGRES_PASSWORD: smq_pass
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    depends_on: [db, redis]
    environment:
      DATABASE_URL: postgresql://smq_user:smq_pass@db/si_smq

  frontend:
    build: ./frontend
    ports: ["3000:3000"]

volumes:
  postgres_data: